appId: com.mowen.desktop
productName: Mowen
copyright: Copyright © 2026 墨问 / Mowen
artifactName: Mowen-${os}-${arch}.${ext}
asar: true
asarUnpack:
  - out/main/node_modules/node-pty/**
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**"
  - out/main/node_modules/node-pty/**/*
extraResources:
  - from: ../web/dist
    to: web
  - from: ../server/extensions/approval.ts
    to: approval.ts
afterPack: ./afterPack.mjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  identity: null
  artifactName: Mowen-${os}-${arch}.${ext}
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: Mowen
win:
  icon: build/icon.png
  artifactName: Mowen-${os}-${arch}.${ext}
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Mowen
  artifactName: Mowen-${os}-${arch}-setup.${ext}
portable:
  artifactName: Mowen-${os}-${arch}-portable.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
npmRebuild: false
