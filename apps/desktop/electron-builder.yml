appId: com.mypi.desktop
productName: MyPi
copyright: Copyright © 2026 MyPi
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/**"
extraResources:
  - from: ../web/dist
    to: web
  - from: ../server/extensions/approval.ts
    to: approval.ts
afterPack: ./afterPack.mjs
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - dmg
    - zip
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: build/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: true
  perMachine: false
  shortcutName: MyPi
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Development
npmRebuild: false
