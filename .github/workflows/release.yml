name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish as a prerelease
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: macOS
            pack: desktop:pack:mac
            artifact: mac
          - runner: windows-latest
            label: Windows x64
            pack: desktop:pack:win
            artifact: win-x64
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and test
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: Pack desktop app
        run: pnpm ${{ matrix.pack }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mypi-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect install scripts
        run: |
          mkdir -p dist
          cp scripts/install-macos.sh dist/install-macos.sh
          cp scripts/install-windows.ps1 dist/install-windows.ps1
          chmod +x dist/install-macos.sh
          ls -la dist

      - name: Stable release from tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Nightly prerelease from main
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Automated desktop build from `${{ github.sha }}`.

            **macOS**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-macos.sh | bash
            ```
            Nightly:
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/nightly/install-macos.sh | bash -s -- --nightly
            ```

            **Windows (PowerShell)**
            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install-windows.ps1 | iex
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
